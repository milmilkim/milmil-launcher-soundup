plugins {
    id 'com.android.application'
}

android {
    namespace 'com.milmil.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.milmil.launcher"
        minSdk 19
        targetSdk 28
        versionCode 4
        versionName "0.3.0-soundup"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // 사이드로드 전용 앱: Google Play targetSdk 요구사항 검사는 해당 없음
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
